<main>
  <h2>Device Tests</h2>
  <p>
    <button class="button" (click)="takePhoto(true)">Take Photo&Edit</button>
  </p>
  <p>
    <button class="button" (click)="takePhoto(false)">Take Photo</button>
  </p>
  <p>
    <input class="form-control" type="text" [(ngModel)]="qrResultString" placeholder="QR Code" appBarcodeScaner />
  </p>
  <p>
    <button class="button" (click)="route.navigate(['/device-test/read-nfc'])">NFC Read</button>
  </p>

  <P>
    <img id="image" [src]="imageSrc" alt="" width='100%' height='400px' *ngIf="isTakePhoto">
  </P>
  <P>
    <textarea rows="20" *ngIf="isScan" [(ngModel)]="qrResultString" style="width: 100%;" readonly></textarea>
  </P>

  <abp-modal [(visible)]="isScanBarcode" [options]="{size:'lg'}">
    <ng-template #abpBody>
      <zxing-scanner [torch]="torchEnabled" [device]="deviceCurrent" (deviceChange)="onDeviceChange($event)"
        (scanSuccess)="onCodeResult($event)" [formats]="formatsEnabled" [tryHarder]="tryHarder"
        (permissionResponse)="onHasPermission($event)" (camerasFound)="onCamerasFound($event)"
        (torchCompatible)="onTorchCompatible($event)"></zxing-scanner>
    </ng-template>

  </abp-modal>

</main>
