<app-modeling-template [title]="'::MENU_UserGroup'" [data]="data" [list]="list" [objectType]="'UserGroup'"
    [copyPrefix]="'::LABEL_NewUserGroup'"
    [permissions]="{create: 'UserGroup.Create', edit: 'UserGroup.Edit', delete: 'UserGroup.Delete', copy: 'UserGroup.Copy', import: 'UserGroup.Import', export: 'UserGroup.Export'}"
    [columns]="columns" [hasLastUpdate]="true" [customAction]="" (dataAdd)="add()" (dataEdit)="edit($event)"
    (dataDelete)="delete($event)" (multiDelete)="multiDelete($event)" (dataViewHistory)="viewHistory($event)"
    (export)="export($event)" (exportAll)="exportAll($event)" (import)="import($event)"
    (copyData)="copy($event, edit.bind(this))" (customActionTrigger)="openPermissionsModal($event)"
    [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [options]="{windowClass: 'createModalWindow'}" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">
            <div class="row">
                <div class="col-12 col-md-6 mb-2">
                    <label for="userGroup-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name' |
                        abpLocalization}}</label><span> * </span>
                    <input type="text" id="userGroup-name" class="form-control" formControlName="name" autofocus
                        (input)="form.controls['displayName'].setValue($event.target.value)" />
                </div>
                <div class="col-12 col-md-6 mb-2">
                    <label for="userGroup-displayName"
                        [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName' |
                        abpLocalization}}</label><span> * </span>
                    <input type="text" id="userGroup-displayName" class="form-control" formControlName="displayName" />
                </div>
                <div class="col-12 col-md-6 mb-2">
                    <label for="userGroup-description"
                        [title]="'::INFO_Description' | abpLocalization">{{'::Description' | abpLocalization}}</label>
                    <input type="text" id="userGroup-description" class="form-control" formControlName="description" />
                </div>
            </div>

            <div class="user-group-manage mb-2">
                <div class="text-end">
                    <button type="button" class="btn btn-primary btn-sm" (click)="addUserRow()">{{'::LABEL_ADD_User' |
                        abpLocalization }}</button>
                </div>
                <div>
                    <ngx-datatable [rows]="selectUsers" [count]="selectUsers.length" rowHeight="auto" [limit]="5"
                        #datatable default>
                        <ngx-datatable-column [name]="'AbpUi::Actions' | abpLocalization" [maxWidth]="100">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                <button type="button" class="btn btn-danger" (click)="deleteUser(row)">{{ '::Delete' |
                                    abpLocalization }}</button>
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                <ng-select [items]="users" appendTo="body" bindValue="id" bindLabel="name"
                                    [(ngModel)]="row.userId" [ngModelOptions]="{standalone: true}"
                                    (ngModelChange)="selectUser($event, row)" [typeahead]="userSearchInput$">
                                    <ng-template ng-option-tmp let-item="item">
                                        <ng-template #tipContent>{{ item.email }}</ng-template>
                                        <span [ngbTooltip]="tipContent" placement="right" container="body"
                                            tooltipClass="my-tooltip-class">
                                            {{ getUserDisplayName(item) }}
                                        </span>
                                    </ng-template>
                                    <ng-template ng-label-tmp let-item="item">
                                        {{ getUserDisplayName(item) }}
                                    </ng-template>
                                </ng-select>
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column [name]="'::Email' | abpLocalization" prop="email">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                {{ row.email }}
                            </ng-template>
                        </ngx-datatable-column>
                    </ngx-datatable>
                </div>
            </div>
        </form>

        }
        @else {
        <div *ngIf=" !form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i>
        </div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal *ngIf="isHistoryModalVisible" [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm *ngIf="importConfirmVisible" [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData" [objectType]="'UserGroup'" (customeImport)="customeImport($event)">
</app-import-confirm>
