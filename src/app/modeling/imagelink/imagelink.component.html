<app-modeling-template [title]="'vms::MENU_ImageLink' | abpLocalization" [data]="data" [objectType]="'ImageLink'"
    [permissions]="{create: 'ImageLink.Create', edit: 'ImageLink.Update', delete: 'ImageLink.Delete'}"
    [columns]="columns" [customAction]="" [list]="list" (dataAdd)="add()"
    (dataEdit)="edit($event)" (dataDelete)="delete($event)"
    [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="imagelink-section" [title]="'::INFO_Section' | abpLocalization">{{'vms::Section'|abpLocalization}}</label><span> * </span>
                <search-select id="imagelink-section" [items]="sections" displayName="displayName" valueName="id"
                    (change)="selectChange($event)" [value]="this.form.controls['section'].value">
                </search-select>
            </div>
           
            <div class="form-group mb-2">
                <label for="imagelink-heading" [title]="'::INFO_Heading' | abpLocalization">{{'vms::Heading'|abpLocalization}}</label><span> * </span>
                <input type="text" id="imagelink-heading" class="form-control" formControlName="heading"/>
            </div>

            <div class="form-group mb-2">
                <label for="imagelink-body" [title]="'::INFO_Body' | abpLocalization">{{'vms::Body'|abpLocalization}}</label>
                <input type="text" id="imagelink-body" class="form-control" formControlName="body"/>
            </div>

            <div class="form-group mb-2">
                <label for="imagelink-url" [title]="'::INFO_URL' | abpLocalization">{{'vms::URL'|abpLocalization}}</label><span> * </span>
                <input type="text" id="imagelink-url" class="form-control" formControlName="url"/>
            </div>

            <div class="form-group mb-2">
                <label for="image-photo"
                    [title]="'::INFO_Photo' | abpLocalization">{{'vms::Photo'|abpLocalization}}</label><span> * </span>
                <input #fileInput id="image-photo" type="file" class="form-control"
                    (change)="onFileChange($event)" accept="image/*" />
                <div *ngIf="photoUrl" class="mt-2">
                    <img [src]="photoUrl" alt="icon"
                         style="max-width: 100px; max-height: 100px;" />
                </div>
            </div>
        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
