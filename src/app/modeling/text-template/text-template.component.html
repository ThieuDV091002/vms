<app-modeling-template [title]="'::TextTemplate'" [data]="data" [objectType]="'TextTemplates'"
    [copyPrefix]="'::LABEL_NewTextTemplate'"
    [permissions]="{create: 'TextTemplate.Create', edit: 'TextTemplate.Edit', delete: 'TextTemplate.Delete', copy: 'TextTemplate.Copy', import: 'TextTemplate.Import', export: 'TextTemplate.Export'}"
    [columns]="columns" [customAction]="" (customActionTrigger)="openPermissionsModal($event)" [list]="list" [noDisplayNameCopy]="true"
    (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)" (multiDelete)="multiDelete($event)"
    (dataViewHistory)="viewHistory($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)"
    (copyData)="copy($event, edit.bind(this))" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {

        <form [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="textTemplate-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="textTemplate-name" class="form-control" formControlName="name" autofocus />
            </div>
            <div class="form-check form-switch form-group mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="textTemplate-isLayout"
                    formControlName="isLayout" (change)="isShowLayout=!isShowLayout">
                <label class="form-check-label" for="textTemplate-isLayout" [title]="'::INFO_IsLayout' | abpLocalization">{{'::IsLayout'|abpLocalization}}</label>
            </div>
            <div class="form-group mb-2" *ngIf="!isShowLayout">
                <label for="textTemplate-layout" [title]="'::INFO_Layout' | abpLocalization">{{'::Layout'|abpLocalization}}</label>
                <select class="form-control form-select" id="textTemplate-layout" formControlName="layoutId">
                    <option [ngValue]="null"></option>
                    <option [ngValue]="layout.id" *ngFor="let layout of layouts">
                        {{ layout.displayName || layout.name }}
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label for="textTemplate-content" [title]="'::INFO_Content' | abpLocalization">{{'::Content'|abpLocalization}}</label><span> * </span>
                <textarea type="text" id="textTemplate-content" class="form-control" rows="10"
                    formControlName="content"></textarea>
            </div>

        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'TextTemplates'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
