<app-modeling-template [title]="'::States'" [data]="data" [objectType]="'States'" [copyPrefix]="'::LABEL_NewState'"
    [permissions]="{create: 'State.Create', edit: 'State.Edit', delete: 'State.Delete', copy: 'State.Copy', import: 'State.Import', export: 'State.Export'}"
    [columns]="columns" [customAction]="" (customActionTrigger)="openPermissionsModal($event)" [list]="list"
    (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)" (multiDelete)="multiDelete($event)"
    (dataViewHistory)="viewHistory($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)"
    (copyData)="copy($event, edit.bind(this))" [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="state-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="state-name" class="form-control" formControlName="name" autofocus
                    (input)="form.controls['displayName'].setValue($event.target.value)"/>
            </div>

            <div class="form-group mb-2">
                <label for="state-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> * </span>
                <input type="text" id="state-displayName" class="form-control"
                    formControlName="displayName" />
            </div>

            <div class="form-group mb-2">
                <label for="state-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                <textarea type="text" id="state-description" class="form-control"
                    formControlName="description"></textarea>
            </div>



            <div class="form-group mb-2">
                <label
                    for="state-color" [title]="'::INFO_Color' | abpLocalization">{{'::LABEL_Color'|abpLocalization}}</label>
                <div class="color-picker">
                    <input type="text" id="state-color" class="form-control"
                        formControlName="color" />
                    <input type="color" class="color-selector" [value]="selectedColor"
                        (input)="updateColor($event.target.value, 'color')" />
                </div>
            </div>

            <div class="form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="state-isCompleted"
                        formControlName="isCompleted" />
                    <label for="state-isCompleted" [title]="'::INFO_IsCompleted' | abpLocalization">{{'::LABEL_IsCompleted'|abpLocalization}}</label>
                </div>
            </div>

        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'States'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
