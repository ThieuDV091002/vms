<app-modeling-template [title]="'vms::MENU_LocalAdmin' | abpLocalization" [data]="data" [objectType]="'LocalAdmin'"
    [permissions]="{create: 'LocalAdmin.Create', edit: 'LocalAdmin.Update', delete: 'LocalAdmin.Delete'}"
    [columns]="columns" [customAction]="" [list]="list" (dataAdd)="add()"
    (dataEdit)="edit($event)" (dataDelete)="delete($event)"
    [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">
            <div class="form-group mb-2">
                <label for="localadmin-fullName" [title]="'::INFO_FullName' | abpLocalization">{{'vms::FullName'|abpLocalization}}</label><span> * </span>
                <input type="text" id="localadmin-fullName" class="form-control" formControlName="fullName"/>
            </div>

            <div class="form-group mb-2">
                <label for="localadmin-kochID" [title]="'::INFO_KochID' | abpLocalization">{{'vms::KochID'|abpLocalization}}</label><span> * </span>
                <input type="text" id="localadmin-kochID" class="form-control" formControlName="kochID"/>
            </div>

            <div class="form-group mb-2">
                <label for="localadmin-title" [title]="'::INFO_Title' | abpLocalization">{{'vms::Title'|abpLocalization}}</label><span> * </span>
                <input type="text" id="localadmin-title" class="form-control" formControlName="title"/>
            </div>

            <div class="form-group mb-2">
                <label for="localadmin-site" [title]="'::INFO_Site' | abpLocalization">{{'vms::Site'|abpLocalization}}</label><span> * </span>
                <search-select id="localadmin-site" [items]="sites" displayName="displayName" valueName="id"
                    (change)="selectChange($event)" [value]="this.form.controls['site'].value">
                </search-select>
            </div>

            <div class="form-group mb-2">
                <label for="localadmin-photo"
                    [title]="'::INFO_Photo' | abpLocalization">{{'vms::Photo'|abpLocalization}}</label><span> * </span>
                <input #fileInput id="localadmin-photo" type="file" class="form-control"
                    (change)="onFileChange($event)" accept="image/*" />
                <div *ngIf="photoUrl" class="mt-2">
                    <img [src]="photoUrl" alt="icon"
                         style="max-width: 100px; max-height: 100px;" />
                </div>
            </div>
        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
