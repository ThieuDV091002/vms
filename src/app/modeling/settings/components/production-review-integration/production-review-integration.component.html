<abp-page>
  <abp-page-toolbar-container>
    <button class="btn btn-primary btn-sm" abpButton="Primary" (click)="addKafka()" tooltip="aaa">
      <i class="fa fa-plus me-1" aria-hidden="true"></i>
      {{ 'AbpIdentity::Permission:Create' | abpLocalization }}
    </button>
  </abp-page-toolbar-container>
  <div class="card">
    <ngx-datatable class=" bootstrap" [rows]="kafkaList" [columns]="columns" [columnMode]="'force'" [headerHeight]="50"
      [footerHeight]="50" [rowHeight]="'auto'">
      <ngx-datatable-column name="名称" prop="name"></ngx-datatable-column>
      <ngx-datatable-column name="地址" prop="address"></ngx-datatable-column>
      <ngx-datatable-column name="操作">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button class="btn btn-outline-primary btn-sm" (click)="editKafka(row)" title="edit">
            <li class="fas fa-pen"></li>
          </button>
          <button class="btn btn-outline-danger btn-sm m-1" (click)="deleteKafka(row)" title="delete">
            <li class="fas fa-trash"></li>
          </button>
        </ng-template>
      </ngx-datatable-column>

    </ngx-datatable>
    <abp-modal [(visible)]="isModalOpen">
      <ng-template #abpHeader>
        <h3>{{'::CopyInstance' | abpLocalization}}</h3>
      </ng-template>

      <ng-template #abpBody>
        <div [formGroup]="form">

        </div>
        <!-- <div class="form-group">
      <label>{{'::Data Tier' | abpLocalization}}: </label>
      <select class="form-control" #newDataTierInput [(ngModel)]="newData.dataTier">
        <option *ngFor="let dataTier of dataTiers" [value]="dataTier.id">{{dataTier.displayName}}</option>
      </select>
    </div> -->
      </ng-template>

      <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
          {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <button class="btn btn-primary" [disabled]="!form.valid || isTreeViewAval()" (click)="isModalOpen=false">
          <i class="fa fa-check"></i>
          {{'AbpIdentity::Save' | abpLocalization }}
        </button>
      </ng-template>
    </abp-modal>
    <div class="row">
      <div class="col col-12">
        <hr />
      </div>
    </div>
    <div>
      <abp-button buttonClass="btn btn-primary  btn-sm" iconClass="fa-regular fa-floppy-disk" (click)="save()">
        {{ 'AbpIdentity::Save' | abpLocalization }}
      </abp-button>
    </div>
  </div>
</abp-page>
