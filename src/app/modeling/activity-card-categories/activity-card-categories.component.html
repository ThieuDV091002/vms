<app-modeling-template [title]="'::MENU_ActivityCardCategory'" [data]="data" [objectType]="'ActivityCardCategory'"
  [copyPrefix]="'::LABEL_NewActivityCardCategory'"
  [permissions]="{create: 'ActivityCardCategory.Create', edit: 'ActivityCardCategory.Edit', delete: 'ActivityCardCategory.Delete', copy: 'ActivityCardCategory.Copy', import: 'ActivityCardCategory.Import', export: 'ActivityCardCategory.Export'}"
  [columns]="columns" [list]="list" [hasLastUpdate]="true" (copyData)="copy($event, edit.bind(this))" (multiDelete)="multiDelete($event)"
  (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (exportAll)="exportAll($event)"
  (import)="import($event)" (dataViewHistory)="viewHistory($event)" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy">
  <ng-template #abpHeader>
    <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    @if (activityCardCategoryForm) {
    <form [formGroup]="activityCardCategoryForm" (ngSubmit)="save()">
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button"
            role="tab" aria-controls="general" aria-selected="true">
            {{ '::General' | abpLocalization }}
          </button>
        </li>
      </ul>
      <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
          <div class="form-group mb-2">
            <label for="activity-card-category-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
            <input type="text" id="activity-card-category-name" class="form-control" formControlName="name" autofocus
            (input)="activityCardCategoryForm.controls['displayName'].setValue($event.target.value)"/>
            </div>
          <div class="form-group mb-2">
            <label for="activity-card-category-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> *</span>
            <input type="text" id="activity-card-category-displayName" class="form-control"
              formControlName="displayName" />
          </div>
          <div class="form-group mb-2">
            <label for="activity-card-category-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
            <input type="text" id="activity-card-category-description" class="form-control"
              formControlName="description" />
          </div>
          <div class="form-group mb-2">
            <label
              for="activity-card-category-activity-card-type" [title]="'::INFO_ActivityCardType' | abpLocalization">{{'::LABEL_ActivityCardType'|abpLocalization}}</label><span> *</span>
            <ng-select appendTo="body" [items]="cardTypes" bindValue="id" bindLabel="displayName" formControlName="cardTypeId">
              <ng-template ng-option-tmp let-item="item">
                {{ item.displayName || item.name }}
              </ng-template>
              <ng-template ng-label-tmp let-item="item">
                {{ item.displayName || item.name }}
              </ng-template>
            </ng-select>
          </div>
          <div class="form-group mb-2">
            <label for="activity-card-category-reasonsDataSource" [title]="'::INFO_ReasonsDataSource' | abpLocalization">{{'::LABEL_ReasonsDataSource'|abpLocalization}}</label>
            <ng-select [items]="['LocalDowntimeReason', 'LocalScrapReason']" bindLabel="name" bindValue="value"
              formControlName="reasonsDataSource"></ng-select>
          </div>
          <div class="form-group mb-2">
              <label for="activity-card-category-color" [title]="'::INFO_Color' | abpLocalization">{{'::LABEL_Color' | abpLocalization}}</label>
              <div class="color-picker">
                <input type="text" id="activity-card-category-color" class="form-control" formControlName="color" />
                <input type="color" class="color-selector" [value]="selectedColor" (input)="updateColor($event.target.value, 'color')" />
              </div>
          </div>
          <div class="form-group">
            <label for="site-KPI-indicator" [title]="'::INFO_SiteKPIIndicator' | abpLocalization">{{'::LABEL_SiteKPIIndicator'|abpLocalization}}</label>
            <ng-select [items]="siteKPIIndicatorOptions" dropdownPosition="top" bindLabel="name" bindValue="value"
                       formControlName="siteKPIIndicator"></ng-select>
          </div>
          <!-- <div class="form-group mb-2">
            <label for="mtdLimit" [title]="'::INFO_MTDLimit' | abpLocalization">{{'::LABEL_MTDLimit'|abpLocalization}}</label>
            <input type="number" min="0" id="mtdLimit" class="form-control"
              formControlName="mtdLimit" />
          </div>
          <div class="form-group">
            <label for="ytdLimit" [title]="'::INFO_YTDLimit' | abpLocalization">{{'::LABEL_YTDLimit'|abpLocalization}}</label>
            <input type="number" min="0" id="ytdLimit" class="form-control"
              formControlName="ytdLimit" />
          </div> -->
        </div>
      </div>
    </form>
    } @else {
    <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    }
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="activityCardCategoryForm?.invalid" (click)="save()">
      {{ 'AbpIdentity::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
  <ng-template #abpHeader>
  </ng-template>
  <ng-template #abpBody>
    <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
  </ng-template>
  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Close' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'ActivityCardCategory'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
