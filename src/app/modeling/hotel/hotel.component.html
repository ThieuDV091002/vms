<app-modeling-template [title]="'vms::MENU_Hotel' | abpLocalization" [data]="data" [objectType]="'Hotel'"
    [permissions]="{create: 'Hotel.Create', edit: 'Hotel.Update', delete: 'Hotel.Delete', copy: 'Hotel.Copy', import: 'Hotel.Import', export: 'Hotel.Export'}"
    [columns]="columns" [customAction]="" [list]="list" (dataAdd)="add()" [copyPrefix]="'::LABEL_NewHotel' | abpLocalization"
    (dataEdit)="edit($event)" (dataDelete)="delete($event)" (multiDelete)="multiDelete($event)"
    (dataViewHistory)="viewHistory($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)"
    (copyData)="copy($event, edit.bind(this))" [hasLastUpdate]="false" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="hotel-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="hotel-name" class="form-control" formControlName="name" autofocus
                    (input)="form.controls['displayName'].setValue($event.target.value)"/>
            </div>

            <div class="form-group mb-2">
                <label for="hotel-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::Display Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="hotel-displayName" class="form-control"
                    formControlName="displayName" />
            </div>

            <div class="form-group mb-2">
                <label for="hotel-room" [title]="'::INFO_Room' | abpLocalization">{{'vms::Room'|abpLocalization}}</label><span> * </span>
                <input type="text" id="hotel-room" class="form-control"
                    formControlName="room" />
            </div>

            <div class="form-group mb-2">
                <label for="hotel-roomRate" [title]="'::INFO_RoomRate' | abpLocalization">{{'vms::Room Rate'|abpLocalization}}</label><span> * </span>
                <input type="text" id="hotel-roomRate" class="form-control"
                    formControlName="roomRate" />
            </div>

            <div class="form-group mb-2">
                <label for="hotel-address" [title]="'::INFO_Address' | abpLocalization">{{'vms::Address'|abpLocalization}}</label><span> * </span>
                <textarea type="text" id="hotel-address" class="form-control"
                    formControlName="address"></textarea>
            </div>

            <div class="form-group mb-2">
                <label for="distance-to-molex" [title]="'::INFO_DistanceToMolexDongAnh' | abpLocalization">
                    {{'vms::DistanceToMolexDongAnh' | abpLocalization}}
                </label><span> * </span>
                <input type="number" id="distance-to-molex" class="form-control"
                        formControlName="distanceToMolexDongAnh" step="any" />
            </div>

            <div class="form-group mb-2">
            <label for="driving-time-to-molex" [title]="'::INFO_DrivingTimeToMolexDongAnh' | abpLocalization">
                {{'vms::DrivingTimeToMolexDongAnh' | abpLocalization}}
            </label><span> * </span>
            <input type="number" id="driving-time-to-molex" class="form-control"
                    formControlName="drivingTimeToMolexDongAnh" step="any" />
            </div>

            <div class="form-group mb-2">
            <label for="distance-to-noibai" [title]="'::INFO_DistanceToNoiBai' | abpLocalization">
                {{'vms::DistanceToNoiBai' | abpLocalization}}
            </label><span> * </span>
            <input type="number" id="distance-to-noibai" class="form-control"
                    formControlName="distanceToNoiBai" step="any" />
            </div>

            <div class="form-group mb-2">
            <label for="driving-time-to-noibai" [title]="'::INFO_DrivingTimeToNoiBai' | abpLocalization">
                {{'vms::DrivingTimeToNoiBai' | abpLocalization}}
            </label><span> * </span>
            <input type="number" id="driving-time-to-noibai" class="form-control"
                    formControlName="drivingTimeToNoiBai" step="any" />
            </div>

            <div class="form-group mb-2">
                <label for="hotel-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                <textarea type="text" id="hotel-description" class="form-control"
                    formControlName="description"></textarea>
            </div>
        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'Hotel'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
