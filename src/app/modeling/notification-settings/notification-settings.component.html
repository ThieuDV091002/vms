<app-modeling-template [title]="'::MENU_NotificationSetting'" [data]="data"
  [objectType]="'NotificationSettings'"
  [copyPrefix]="'::LABEL_NotificationSetting'"
  [permissions]="{create: 'NotificationSetting.Create', edit: 'NotificationSetting.Edit', delete: 'NotificationSetting.Delete', copy: 'NotificationSetting.Copy', import: 'NotificationSetting.Import', export: 'NotificationSetting.Export'}"
  [columns]="columns" [list]="list" (dataAdd)="add()" (dataEdit)="edit($event)"
  [copyDisabled]="true"
  (dataDelete)="delete($event)"
  (multiDelete)="multiDelete($event)" (dataViewHistory)="viewHistory($event)"
  (export)="export($event)"
  (exportAll)="exportAll($event)" (import)="import($event)"
  (copyData)="copy($event, edit.bind(this))"
  [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization"
  [importAndExportOnlyJson]="true">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [options]="{size: 'xl'}">
  <ng-template #abpHeader>
    <div class="d-flex justify-content-between align-items-center header-width">
      <h3 class="m-0">{{ (currentNotificationSetting?.id ? '::Edit' :
        '::Create') | abpLocalization }}</h3>
      <div>
        <button type="button" class="btn btn-outline-primary btn-sm me-1"
          (click)="isCollapse = false;">
          {{'::LABEL_ExpandAll' | abpLocalization}}
        </button>
        <button type="button" class="btn btn-outline-primary btn-sm"
          (click)="isCollapse = true;">
          {{'::LABEL_CollapseAll' | abpLocalization}}
        </button>
      </div>
    </div>
  </ng-template>

  <ng-template #abpBody>
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">
      <div class="accordion accordion-flush">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" data-bs-toggle="collapse"
              data-bs-target="#general"
              type="button" aria-controls="general" aria-expanded="true"
              [class.collapsed]="isCollapse">
              {{ '::LABEL_General' | abpLocalization }}
            </button>
          </h2>
          <div id="general" class="accordion-collapse collapse"
            [class.show]="!isCollapse">
            <div class="accordion-body">
              <div class="row">
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-microservice"
                      [title]="'::LABEL_Microservice' | abpLocalization">{{'::LABEL_Microservice'|abpLocalization}}</label><span>
                      * </span>
                    <ng-select id="notification-setting-microservice"
                      appendTo="body" [items]="microserviceSelectList"
                      bindValue="name" bindLabel="name"
                      formControlName="microservice"
                      (change)="onMicroserviceChange($event)"
                      [clearable]="form.controls['microservice'].value">
                    </ng-select>
                  </div>
                </div>
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-object"
                      [title]="'::LABEL_Object' | abpLocalization">{{'::LABEL_Object'|abpLocalization}}</label>
                    <span> * </span>
                    <ng-select id="notification-setting-object" appendTo="body"
                      [items]="objectSelectList" bindValue="name"
                      bindLabel="name" formControlName="object"
                      (change)="onObjectChange($event)"
                      [clearable]="form.controls['object'].value">
                    </ng-select>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-action"
                      [title]="'::LABEL_Action' | abpLocalization">{{'::LABEL_Action'|abpLocalization}}</label><span>
                      * </span>
                    <ng-select id="notification-setting-action" appendTo="body"
                      [items]="actionSelectList" bindValue="name"
                      bindLabel="name" formControlName="action"
                      (change)="onActionChange($event)"
                      [clearable]="form.controls['action'].value">
                    </ng-select>
                  </div>
                </div>
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-api"
                      [title]="'::LABEL_API' | abpLocalization">{{'::LABEL_API'|abpLocalization}}</label>
                    <span> * </span>
                    <ng-select id="notification-setting-api" appendTo="body"
                      [items]="apiSelectList" bindValue="name" bindLabel="name"
                      formControlName="api"
                      (change)="onApiChange($event)"
                      [clearable]="form.controls['api'].value">
                    </ng-select>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-description"
                      [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                    <input type="text" id="notification-setting-description"
                      class="form-control"
                      formControlName="description" />
                  </div>
                </div>
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-topic"
                      [title]="'::LABEL_TopicName' | abpLocalization">{{'::LABEL_TopicName'|abpLocalization}}</label>
                    <input type="text" id="notification-setting-topic"
                      class="form-control"
                      formControlName="topic" />
                  </div>
                </div>
                <div class="col-4 mb-2">
                  <div class="form-group">
                    <label for="notification-setting-sender"
                      [title]="'::LABEL_Sender' | abpLocalization">{{'::LABEL_Sender'|abpLocalization}}</label>
                    <input type="text" id="notification-setting-sender"
                      class="form-control"
                      formControlName="sender" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" data-bs-toggle="collapse"
              data-bs-target="#details"
              type="button" aria-controls="details" aria-expanded="true"
              [class.collapsed]="isCollapse">
              {{ '::Details' | abpLocalization }}
            </button>
          </h2>
          <div id="details" class="accordion-collapse collapse"
            [class.show]="!isCollapse">
            <div class="accordion-body">
              <app-notification-settings-details
                [currentNotificationSettingDetails]="currentDetail"
                [saveUserList]="currentDetailUserList"
                [saveUserGroupList]="currentDetailUserGroupList"
                [initContentTemplateList]="initContentTemplateList"
                [initUserList]="initUserList"
                [initUserGroupList]="initUserGroupList"
                (saveChange)="saveDetail($event)"
              ></app-notification-settings-details>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner"
        aria-hidden="true"></i></div>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="form?.invalid"
      (click)="save()">{{
      'AbpIdentity::Save' | abpLocalization
      }}</abp-button>
  </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
  <ng-template #abpHeader>
  </ng-template>
  <ng-template #abpBody>
    <app-modeling-import-detail
      [items]="importResult"></app-modeling-import-detail>
  </ng-template>
  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Close' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>

<app-import-confirm [(importConfirmVisible)]="importConfirmVisible"
  [existingData]="existingData"
  [objectType]="'NotificationSettings'" (customeImport)="customeImport($event)">
</app-import-confirm>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>
