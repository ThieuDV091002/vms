<app-modeling-template [title]="'::LABEL_Link'" [data]="data" [objectType]="'Link'"
    [permissions]="{create: 'Link.Create', edit: 'Link.Edit', delete: 'Link.Delete', copy: 'Link.Copy', import: 'Link.Import', export: 'Link.Export'}"
    [copyPrefix]="'::LABEL_NewLink'"
    [columns]="[{displayKey:'::Name', field: 'name'},{displayKey:'::Description', field: 'description'},{displayKey:'::DisplayName', field: 'displayName'}]"
    [list]="list" [hasLastUpdate]="true" (copyData)="copy($event, edit.bind(this))" (multiDelete)="multiDelete($event)" (dataAdd)="add()"
    (dataEdit)="edit($event)" (dataDelete)="delete($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)"
    (dataViewHistory)="viewHistory($event)" (filterChange)="searchByfilter($event)" filterType="Master" [placeholder]="'::LABEL_LinkSearchPlaceholder' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
                    <div class="form-group mb-2">
                        <label for="link-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                        <input type="text" id="link-name" class="form-control" formControlName="name" autofocus
                            (input)="form.controls['displayName'].setValue($event.target.value)" />
                    </div>
                    <div class="form-group mb-2">
                        <label for="link-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> *
                        </span>
                        <input type="text" id="link-displayName" class="form-control" formControlName="displayName" />
                    </div>
                    <div class="form-group mb-2">
                        <label for="link-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                        <input type="text" id="link-description" class="form-control" formControlName="description" />
                    </div>
                    <div class="form-group mb-2">
                        <label for="link-url" [title]="'::INFO_Url' | abpLocalization">{{'::LABEL_Url'|abpLocalization}}</label><span> * </span>
                        <input type="text" id="link-url" class="form-control" formControlName="url" />
                    </div>
                    <div class="form-group mb-2">
                        <label for="link-category" [title]="'::INFO_Category' | abpLocalization">{{ '::Category' | abpLocalization }}</label><span> * </span>
                        <select class="form-control form-select" placeholder="Select Category" id="link-category"
                            formControlName="linkCategoryId">
                            <option [ngValue]="category.id" *ngFor="let category of linkCategoriesData">
                                {{ category.displayName || category.name }}
                            </option>
                        </select>
                    </div>
                    <div class="form-group mb-2">
                        <label for="link-readers" [title]="'::INFO_TargetReaders' | abpLocalization">{{ '::LABEL_TargetReaders'|abpLocalization}}</label><span> * </span>
                        <multiple-select [items]="roleData" displayName="name" valueName="name"
                            (change)="selectedRoleChanges($event)" [values]="selectedRoles">
                        </multiple-select>
                    </div>
                    <div class="form-group">
                        <label for="tags" [title]="'::INFO_Tags' | abpLocalization">{{ '::LABEL_Tags' | abpLocalization }}</label>
                        <tag-input id="tags" class="form-control" [placeholder]="''" [secondaryPlaceholder]="''"
                            [addOnBlur]="true" [modelAsStrings]="true" formControlName="tags">
                        </tag-input>
                    </div>

                </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'Link'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
