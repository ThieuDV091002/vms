<app-modeling-template [title]="'::MENU_LocalDowntimeReason'" [data]="data" [objectType]="'LocalDowntimeReasons'"
    [permissions]="{create: 'LocalDowntimeReason.Create', edit: 'LocalDowntimeReason.Edit', delete: 'LocalDowntimeReason.Delete', copy: 'LocalDowntimeReason.Copy', import: 'LocalDowntimeReason.Import', export: 'LocalDowntimeReason.Export'}"
    [columns]="columns" [customAction]="" [list]="list" (dataAdd)="add()"
    [copyPrefix]="'::LABEL_NewLocalDowntimeReason'" (dataEdit)="edit($event)" (dataDelete)="delete($event)"
    (multiDelete)="multiDelete($event)" (dataViewHistory)="viewHistory($event)" (export)="export($event)" (exportAll)="exportAll($event)"
    (import)="import($event)" (copyData)="copy($event, edit.bind(this))" [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="local-downtime-reasons-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="local-downtime-reasons-name" class="form-control" formControlName="name"
                    autofocus (input)="form.controls['displayName'].setValue($event.target.value)"/>
            </div>

            <div class="form-group mb-2">
                <label for="local-downtime-reasons-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> * </span>
                <input type="text" id="local-downtime-reasons-displayName" class="form-control"
                    formControlName="displayName" />
            </div>

            <div class="form-group mb-2">
                <label for="local-downtime-reasons-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                <textarea type="text" id="local-downtime-reasons-description" class="form-control"
                    formControlName="description"></textarea>
            </div>

            <div class="form-group mb-2">
                <label for="local-downtime-reasons-code" [title]="'::INFO_GlobalDowntimeCode' | abpLocalization">{{'::LABEL_GlobalDowntimeCode'|abpLocalization}}</label><span> *
                </span>
                <ng-select [items]="globalDowntimeCodes" appendTo="body" bindValue="id" bindLabel="displayName" formControlName="globalDowntimeCodeId">
                  <ng-template ng-option-tmp let-item="item">
                    {{ item.displayName || item.name }}
                  </ng-template>
                  <ng-template ng-label-tmp let-item="item">
                    {{ item.displayName || item.name }}
                  </ng-template>
                </ng-select>
            </div>

            <div class="form-group mb-2">
                <label for="local-downtime-reasons-isplanned" [title]="'::INFO_IsPlanned' | abpLocalization">{{'::LABEL_IsPlanned'|abpLocalization}}</label>
                <select class="form-select" formControlName="isPlanned">
                    <option value=""></option>
                    <option value="Yes">{{'::Yes'| abpLocalization}}</option>
                    <option value="No">{{'::No'| abpLocalization}}</option>
                </select>
            </div>

        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'LocalDowntimeReasons'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
