<app-modeling-template [title]="'::MENU_ActivityCardReason'" [data]="data" [objectType]="'ActivityCardReason'"
  [copyPrefix]="'::LABEL_NewActivityCardReason'"
  [permissions]="{create: 'ActivityCardReason.Create', edit: 'ActivityCardReason.Edit', delete: 'ActivityCardReason.Delete', copy: 'ActivityCardReason.Copy', import: 'ActivityCardReason.Import', export: 'ActivityCardReason.Export'}"
  [columns]="columns" [list]="list" [hasLastUpdate]="true" (copyData)="copy($event, edit.bind(this))" (multiDelete)="multiDelete($event)"
  (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)" (export)="export($event)" (exportAll)="exportAll($event)"
  (import)="import($event)" (dataViewHistory)="viewHistory($event)" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy">
  <ng-template #abpHeader>
    <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    @if (activityCardReasonForm) {
    <form [formGroup]="activityCardReasonForm" (ngSubmit)="save()">
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="general-tab" data-bs-toggle="tab" data-bs-target="#general" type="button"
            role="tab" aria-controls="general" aria-selected="true">
            {{ '::General' | abpLocalization }}
          </button>
        </li>
      </ul>
      <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
          <div class="form-group mb-2">
            <label for="activity-card-reason-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
            <input type="text" id="activity-card-reason-name" class="form-control" formControlName="name" autofocus
            (input)="activityCardReasonForm.controls['displayName'].setValue($event.target.value)"/>
          </div>
          <div class="form-group mb-2">
            <label for="activity-card-reason-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> *</span>
            <input type="text" id="activity-card-reason-displayName" class="form-control"
              formControlName="displayName" />
          </div>
          <div class="form-group mb-2">
            <label for="activity-card-reason-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
            <input type="text" id="activity-card-reason-description" class="form-control"
              formControlName="description" />
          </div>
          <div class="form-group mb-2">
            <label
              for="activity-card-reason-activity-card-category" [title]="'::INFO_ActivityCardCategory' | abpLocalization">{{'::LABEL_ActivityCardCategory'|abpLocalization}}</label><span>
              * </span>
            <ng-select appendTo="body" [items]="cardCategories" bindValue="id" formControlName="cardCategoryId">
              <ng-template ng-option-tmp let-item="item">
                {{ item.displayName || item.name }}
              </ng-template>
              <ng-template ng-label-tmp let-item="item">
                {{ item.displayName || item.name }}
              </ng-template>
            </ng-select>
          </div>
        </div>
      </div>
    </form>
    } @else {
    <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    }
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="activityCardReasonForm?.invalid" (click)="save()">
      {{ 'AbpIdentity::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
  <ng-template #abpHeader>
  </ng-template>
  <ng-template #abpBody>
    <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
  </ng-template>
  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-primary" abpClose>
      {{ 'AbpIdentity::Close' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'ActivityCardReason'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
