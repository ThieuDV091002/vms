<app-modeling-template [title]="'::MENU_StandardCategories'" [data]="data" [objectType]="'StandardCategories'"
    [permissions]="{create: 'StandardCategory.Create', edit: 'StandardCategory.Edit', delete: 'StandardCategory.Delete', copy: 'StandardCategory.Copy', import: 'StandardCategory.Import', export: 'StandardCategory.Export'}"
    [columns]="[{displayKey:'::Name', field: 'name'},{displayKey:'::Description', field: 'description'},{displayKey:'::DisplayName', field: 'displayName'}]"
    [list]="list" [hasLastUpdate]="true" (copyData)="copy($event)" [copyPrefix]="'::LABEL_NewStandardCategory'"
    (multiDelete)="multiDelete($event)" (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)"
    (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)" (dataViewHistory)="viewHistory($event)"
    (filterChange)="searchByfilter($event)" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="general" role="tabpanel" aria-labelledby="general-tab">
                    <div class="form-group mb-2">
                        <label for="divisions-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                        <input type="text" id="divisions-name" class="form-control" formControlName="name" autofocus
                            (input)="form.controls['displayName'].setValue($event.target.value)" />
                    </div>
                    <div class="form-group mb-2">
                        <label for="divisions-displayName" [title]="'::INFO_DisplayName' | abpLocalization">{{'::DisplayName'|abpLocalization}}</label><span> * </span>
                        <input type="text" id="divisions-displayName" class="form-control"
                            formControlName="displayName" />
                    </div>
                    <div class="form-group">
                        <label for="divisions-description" [title]="'::INFO_Description' | abpLocalization">{{'::Description'|abpLocalization}}</label>
                        <input type="text" id="divisions-description" class="form-control"
                            formControlName="description" />
                    </div>
                </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>

<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'StandardCategories'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
