<app-modeling-template [title]="'::MENU_CellSetting'" [data]="data" [objectType]="'CellSettings'" [copyPrefix]="'::LABEL_NewCellSetting'"
    [permissions]="{create: 'CellSetting.Create', edit: 'CellSetting.Edit', delete: 'CellSetting.Delete', copy: 'CellSetting.Copy', import: 'CellSetting.Import', export: 'CellSetting.Export'}"
    [columns]="columns" [customAction]="" (customActionTrigger)="openPermissionsModal($event)" [list]="list" (copyModalOpen)="copyModalOpen($event)"
    (dataAdd)="add()" (dataEdit)="edit($event)" (dataDelete)="delete($event)" (multiDelete)="multiDelete($event)"
    (dataViewHistory)="viewHistory($event)" (export)="export($event)" (exportAll)="exportAll($event)"  (import)="import($event)"
    (copyData)="copySetting($event)" [hasLastUpdate]="true" [noNameCopy]="true" [noDisplayNameCopy]="true" [placeholder]="'::LABEL_CellSettingSearch' | abpLocalization">
    <div class="form-group mb-2" id="copyCustomeField">
        <label for="cellId">{{'::LABEL_NewCell'|abpLocalization}}</label><span> * </span>
        <ng-select
          #copyNgSelectField
          id="cellId"
          [items]="cells"
          appendTo="body"
          bindValue="id"
          bindLabel="displayName"
          [typeahead]="cellInput$"
          [placeholder]="'::LABEL_ShowingTopTen' | abpLocalization">
          <ng-template ng-option-tmp let-item="item">
            {{item.displayName}}
          </ng-template>
          <ng-template ng-label-tmp let-item="item">
            {{ item.displayName }}
          </ng-template>
        </ng-select>
    </div>
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">

            <div class="form-group mb-2">
                <label for="cell-setting-cell" [title]="'::INFO_Cell' | abpLocalization">{{'::LABEL_Cell'|abpLocalization}}</label><span> * </span>
                <ng-select
                  id="area-setting-cell"
                  [items]="cells"
                  appendTo="body"
                  bindValue="id"
                  bindLabel="displayName"
                  [typeahead]="cellInput$"
                  [placeholder]="'::LABEL_ShowingTopTen' | abpLocalization"
                  formControlName="cellId">
                  <ng-template ng-option-tmp let-item="item">
                    {{item.displayName }}
                  </ng-template>
                  <ng-template ng-label-tmp let-item="item">
                    {{ item.displayName}}
                  </ng-template>
                </ng-select>
            </div>

            <div class="form-group mb-2">
                <label
                  for="area-setting-kpi" [title]="'::INFO_KPIReviewType' | abpLocalization">{{'::LABEL_KPIReviewType'|abpLocalization}}</label><span> * </span>
                <select class="form-control form-select" id="area-setting-kpi" formControlName="kpiReviewType">
                  <option *ngFor="let type of kpiReviewTypes" [value]="KpiReviewType[type]">{{KpiReviewType[type]}}</option>
                </select>
            </div>

            <div class="form-group mb-2">
                <label
                  for="area-setting-quality" [title]="'::INFO_QualityReviewType' | abpLocalization">{{'::LABEL_QualityReviewType'|abpLocalization}}</label><span> * </span>
                <select class="form-control form-select" id="area-setting-quality" formControlName="qualityReviewType">
                  <option *ngFor="let type of qualityReviewTypes" [value]="QualityReviewType[type]">{{QualityReviewType[type]}}</option>
                </select>
            </div>

        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
<abp-modal [(visible)]="isImportDetailsVisible" [options]="{size: 'lg'}">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <app-modeling-import-detail [items]="importResult"></app-modeling-import-detail>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Close' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>

<app-history-modal
    *ngIf="isHistoryModalVisible"
    [(isHistoryModalVisible)]="isHistoryModalVisible"
    [historys]="historys">
</app-history-modal>

<app-import-confirm
    *ngIf="importConfirmVisible"
    [(importConfirmVisible)]="importConfirmVisible"
    [existingData]="existingData"
    [objectType]="'CellSettings'"
    (customeImport)="customeImport($event)">
</app-import-confirm>
