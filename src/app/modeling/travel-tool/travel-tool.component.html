<app-modeling-template [title]="'vms::MENU_TravelTool' | abpLocalization" [data]="data" [objectType]="'TravelTool'"
    [permissions]="{create: 'Tool.Create', edit: 'Tool.Update', delete: 'Tool.Delete'}"
    [columns]="columns" [customAction]="" [list]="list" (dataAdd)="add()"
    (dataEdit)="edit($event)" (dataDelete)="delete($event)"
    [hasLastUpdate]="true" [placeholder]="'::LABEL_SearchName' | abpLocalization">
</app-modeling-template>

<abp-modal [(visible)]="isModalVisible">
    <ng-template #abpHeader>
        <h3>{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()">
            <div class="form-group mb-2">
                <label for="travel-tool-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label><span> * </span>
                <input type="text" id="travel-tool-name" class="form-control" formControlName="name"/>
            </div>

            <div class="form-group mb-2">
                <label for="travel-tool-url" [title]="'::INFO_Url' | abpLocalization">{{'vms::URL'|abpLocalization}}</label><span> * </span>
                <input type="text" id="travel-tool-url" class="form-control" formControlName="url"/>
            </div>

            <div class="form-group mb-2">
                <label for="travel-tool-toolType" [title]="'::INFO_ToolType' | abpLocalization">{{'vms::ToolType'|abpLocalization}}</label><span> * </span>
                <search-select id="travel-tool-toolType" [items]="types" displayName="displayName" valueName="id"
                    (change)="selectChange($event)" [value]="this.form.controls['toolType'].value">
                </search-select>
            </div>

            <div class="form-group mb-2">
                <label for="travel-tool-photo"
                    [title]="'::INFO_Photo' | abpLocalization">{{'vms::Photo'|abpLocalization}}</label><span> * </span>
                <input #fileInput id="travel-tool-photo" type="file" class="form-control"
                    (change)="onFileChange($event)" accept="image/*" />
                <div *ngIf="photoUrl" class="mt-2">
                    <img [src]="photoUrl" alt="icon"
                         style="max-width: 100px; max-height: 100px;" />
                </div>
            </div>
        </form>
        <div *ngIf="!form" class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">{{
            'AbpIdentity::Save' | abpLocalization
            }}</abp-button>
    </ng-template>
</abp-modal>
