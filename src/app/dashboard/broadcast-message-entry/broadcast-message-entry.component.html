<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy" (visibleChange)="close($event)"  [options]="{ centered: true, size: 'md' }">
    <ng-template #abpHeader>
        <div class="d-flex justify-content-between align-items-center header-width">
            <h3 class="m-0">{{ (selected?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
            <div>
              <button type="button" class="btn btn-outline-primary btn-sm me-1" (click)="isCollapse = false;">
                {{'::LABEL_ExpandAll' | abpLocalization}}
              </button>
              <button type="button" class="btn btn-outline-primary btn-sm" (click)="isCollapse = true;">
                {{'::LABEL_CollapseAll' | abpLocalization}}
              </button>
            </div>
          </div>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="accordion accordion-flush">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                      <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#general" type="button"
                        aria-controls="general" aria-expanded="true" [class.collapsed]="isCollapse">
                        {{ '::LABEL_General' | abpLocalization }}
                      </button>
                    </h2>
                    <div id="general" class="accordion-collapse collapse" [class.show]="!isCollapse">
                        <div class="form-group mb-2 pt-2">
                            <label for="message-category" [title]="'::INFO_Category' | abpLocalization">{{'::Category'|abpLocalization}}</label><span> * </span>
                            <select class="form-control form-select" id="message-category" formControlName="messageCategoryId">
                                <option [ngValue]="null"></option>
                                <option [ngValue]="messageCategory.id" *ngFor="let messageCategory of messageCategoryData">
                                    {{ messageCategory.displayName || messageCategory.name }}
                                </option>
                            </select>
                        </div>
                        <div class="form-group mb-2">
                            <label for="message" [title]="'::INFO_Message' | abpLocalization">{{'::LABEL_Message'|abpLocalization}}</label><span> * </span>
                                <textarea type="text" id="message" class="form-control" formControlName="message" [rows]="6"></textarea>
                            </div>
                        <div class="form-group mb-2">
                            <label for="expiry" [title]="'::INFO_ExpiryDateTime' | abpLocalization">{{'::LABEL_ExpiryDateTime'|abpLocalization}}</label><span> * </span>
                            <input type="text" id="expiry" class="form-control" formControlName="expiryTime" bsDatepicker
                            [bsConfig]="{containerClass: 'theme-dark-blue', adaptivePosition: true, withTimepicker: true, keepDatepickerOpened: true, dateInputFormat: 'DD MMM YYYY hh:mm:ss a'}" />
                        </div>

                        <div class="form-group mb-2">
                            <div class="d-flex align-items-center mb-2">
                                <label class="mb-0 me-1" [title]="'::INFO_Attachments' | abpLocalization">{{'::LABEL_Attachments'|abpLocalization}}</label>
                                <i class="fas fa-camera-retro fa-lg cursor-pointer ms-1 me-2" style="color: #fc276b;"
                                   [title]="'::LABEL_CapturePhoto' | abpLocalization"
                                   (click)="takePhoto(false, AttachmentType.General)"></i>
                                <i class="fas fa-cloud-upload-alt cursor-pointer fa-lg" style="color: #74C0FC;"
                                   [title]="'::LABEL_UploadPictures' | abpLocalization"
                                   (click)="fileInput.click()"></i>
                                <input #fileInput id="upload-file" type="file" class="form-control"
                                       (change)="uploadType = AttachmentType.General;onFileChange($event)"
                                       accept="image/*" style="display: none;" />
                            </div>

                            <div class="attachment-content">
                                <div class="attachment-title d-flex justify-content-end">
                                    <i class="fa fa-trash cursor-pointer delete-icon" [class.disabled]="!selectedAttachments.length"
                                       (click)="selectedAttachments.length ? attachmentDelete(AttachmentType.General) : null"></i>
                                </div>
                                <div class="attchment-contains">
                                    <div class="row">
                                        @for (attachment of attachments; track attachment) {
                                        <div class="col-3 img-container" [class.selected]="attachmentCheck.checked">
                                            <img (click)="isAttachementPreviewOpen = true; previewAttchmentId = attachment.fileId"
                                            [src]="attachmentMap.get(attachment.fileId)" />
                                            <input type="checkbox" name="attachment" #attachmentCheck
                                            (change)="selectedAttchmentsChange($event, attachment.fileId)" />
                                        </div>
                                        }
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                      <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#data-tier" type="button"
                        aria-controls="data-tier" aria-expanded="true" [class.collapsed]="isCollapse">
                        {{ '::LABEL_DataTier' | abpLocalization }}<span> *</span>
                      </button>
                    </h2>
                    <div id="data-tier" class="accordion-collapse collapse pt-1" [class.show]="!isCollapse">
                        <app-tree-view [nodes]="dataTierTreeNode"></app-tree-view>
                    </div>
                  </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner" aria-hidden="true"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" (click)="close()">
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid || !hasAssignedDataTiers()" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>

<abp-modal [(visible)]="isAttachementPreviewOpen" [options]="{size: 'fullscreen'}" (keydown.esc)="isAttachementPreviewOpen = false">
    <ng-template #abpHeader>
    </ng-template>
    <ng-template #abpBody>
        <div class="attachment-preview">
            <img [src]="attachmentMap.get(previewAttchmentId)" />
        </div>
    </ng-template>
</abp-modal>

<abp-modal [(visible)]="isUploadModalOpen">
    <ng-template #abpHeader>
        <h3>{{'::Add' | abpLocalization}}</h3>
    </ng-template>
    <ng-template #abpBody>
        <div class="form-group">
            <label for="upload-file">{{'::File' | abpLocalization}} </label>
            <input id="upload-file" type="file" class="form-control" (change)="onFileChange($event)" accept="image/*" />
        </div>
        <div class="form-group mt-2">
            <label for="" class="form-label text-danger"><span class="fa fa-info-circle"></span> {{'::LABEL_UploadDisclaimer'
                | abpLocalization}} </label>
        </div>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
        {{ '::Cancel' | abpLocalization }}
        </button>
        <button class="btn btn-primary" (click)="uploadImage()" [disabled]="inProgress">
        @if (inProgress) {
            <i class="fa fa-spinner fa-spin"></i>
        {{'::Uploading' | abpLocalization}}
        } @else {
            <i class="fa fa-check"></i>
        {{'::Save' | abpLocalization}}
        }
        </button>
    </ng-template>
</abp-modal>
