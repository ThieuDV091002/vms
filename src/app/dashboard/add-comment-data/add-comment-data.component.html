<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy" [options]="{ centered: true, size: 'lg' }" (visibleChange)="close($event)">
    <ng-template #abpHeader>
        <h3>{{ (selectedComment?.id ? '::Edit' : '::Create') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
            <div class="tab-content" id="myTabContent">
                <div class="form-group mb-2">
                    <label for="production-date" [title]="'::INFO_ProductionDate' | abpLocalization">{{'::LABEL_ProductionDate'|abpLocalization}}</label><span> * </span>
                    <input type="text" id="production-date" class="form-control" formControlName="productionDate"
                        bsDatepicker [bsConfig]="{ dateInputFormat: 'DD MMM YYYY', containerClass: 'theme-dark-blue', adaptivePosition: true }" autofocus />
                </div>
                <div class="form-group mb-2">
                    <label for="area" [title]="'::INFO_Area' | abpLocalization">{{ '::Area' | abpLocalization }}</label><span> * </span>
                    <search-select id="area" [items]="areaData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'area')" [value]="this.form.controls['area'].value">
                    </search-select>
                </div>
                <div class="form-group mb-2">
                    <label for="cell" [title]="'::INFO_Cell' | abpLocalization">{{ '::Cell' | abpLocalization }}</label><span> * </span>
                    <search-select id="cell" [items]="cellData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'cell')" [value]="this.form.controls['cell'].value">
                    </search-select>
                </div>
                <div class="form-group mb-2">
                    <label for="shift" [title]="'::INFO_Shift' | abpLocalization">{{ '::LABEL_Shift' | abpLocalization }}</label><span> * </span>
                    <search-select id="shift" [items]="shiftData" displayName="shiftDisplayName" valueName="shiftId"
                        (change)="selectChange($event, 'shift')" [value]="this.form.controls['shift'].value">
                    </search-select>
                </div>
                <div class="form-group mb-2" *ngIf="showInterval">
                    <label for="shift-iInterval" [title]="'::INFO_ShiftInterval' | abpLocalization">{{ '::LABEL_ShiftInterval' | abpLocalization }}</label>
                    <select class="form-control form-select" id="shift-iInterval" formControlName="shiftInterval">
                        <option [ngValue]="undefined"></option>
                        <option [ngValue]="shiftInterval" *ngFor="let shiftInterval of shiftIntervaltData">
                            {{ shiftInterval }}
                        </option>
                    </select>
                </div>

                <div class="form-group mb-2">
                    <label for="comment" [title]="'::INFO_Comment' | abpLocalization">{{'::LABEL_CommentText'|abpLocalization}}</label><span> * </span>
                    <textarea type="text" id="comment" class="form-control" formControlName="comment"></textarea>
                </div>

                <div class="form-group mb-2">
                    <label for="location-workCenter" [title]="'::INFO_LocationWorkCenter' | abpLocalization">{{'::LABEL_LocationWorkCenter'|abpLocalization}}</label>
                    <input type="text" id="location-workCenter" class="form-control" formControlName="location" />
                </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" (click)="close()">
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>
