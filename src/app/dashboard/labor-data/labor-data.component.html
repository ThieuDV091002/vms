<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy" [options]="{ centered: true, size: 'xl' }"
    (visibleChange)="close($event)">
    <ng-template #abpHeader>
        <h3>{{ '::Create' | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
            <div class="row">
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="area" [title]="'::INFO_Area' | abpLocalization">{{ '::Area' | abpLocalization }}</label><span> * </span>
                    <search-select id="area" [items]="areaData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'area')" [value]="this.form.controls['area'].value">
                    </search-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="cell" [title]="'::INFO_Cell' | abpLocalization">{{ '::Cell' | abpLocalization }}</label><span> * </span>
                    <search-select id="cell" [items]="cellData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'cell')" [value]="this.form.controls['cell'].value">
                    </search-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="workCenter" [title]="'::INFO_WorkCenter' | abpLocalization">{{ '::WorkCenter' | abpLocalization }}</label><span> * </span>
                    <search-select id="workCenter" [items]="workCenterData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'workCenter')" [value]="this.form.controls['workCenter'].value">
                    </search-select>
                </div>

                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="work-order" [title]="'::INFO_WorkOrder' | abpLocalization">{{'::Label_WorkOrder'|abpLocalization}}</label><span> * </span>
                    <input type="text" id="work-order" class="form-control" formControlName="workOrder" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="work-order-qty" [title]="'::INFO_WorkOrderQty' | abpLocalization">{{'::Label_WorkOrderQty'|abpLocalization}}</label>
                    <input appInputNumber [min]="0" id="work-order-qty" class="form-control" formControlName="workOrderQty" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="product" [title]="'::INFO_Product' | abpLocalization">{{ '::LABEL_Product' | abpLocalization }}</label><span> * </span>
                    <ng-select
                    id="product"
                    [items]="productData"
                    appendTo="body"
                    bindValue="id"
                    bindLabel="displayName"
                    [typeahead]="productInput$"
                    [placeholder]="'::LABEL_ShowingTopTen' | abpLocalization"
                    formControlName="product">
                    <ng-template ng-option-tmp let-item="item">
                      {{item.displayName}}
                    </ng-template>
                    <ng-template ng-label-tmp let-item="item">
                      {{ item.displayName}}
                    </ng-template>
                    </ng-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="production-date" [title]="'::INFO_ProductionDate' | abpLocalization">{{ '::LABEL_ProductionDate'|abpLocalization }}</label><span> *
                    </span>
                    <input type="text" id="production-date" class="form-control" formControlName="productionDate"
                        bsDatepicker
                        [bsConfig]="{ dateInputFormat: 'DD MMM YYYY', adaptivePosition: true, containerClass: 'theme-dark-blue' }" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="shift" [title]="'::INFO_Shift' | abpLocalization">{{'::LABEL_Shift'|abpLocalization}}</label><span> * </span>
                    <select class="form-control form-select" id="shift" formControlName="shift">
                        <option [ngValue]="shift.shiftId" *ngFor="let shift of shiftData">
                            {{ shift.shiftDisplayName }}
                        </option>
                    </select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="shift-iInterval" [title]="'::INFO_ShiftInterval' | abpLocalization">{{ '::LABEL_ShiftInterval' | abpLocalization }}</label><span> * </span>
                    <multiple-select id="shift-iInterval" [items]="wholeShiftInterval" displayName="name" valueName="name" [isDisable]="true"
                    [values]="wholeShiftIntervalSelected" [ngClass]="form.controls.applyToWholeShift.value ? '' : 'd-none'">
                    </multiple-select>
                    <multiple-select id="shift-iInterval" [items]="shiftIntervaltData"
                    (change)="selectedChanges($event, 'shiftInterval')" displayName="name" valueName="name"
                    [values]="form.controls.shiftInterval.value" [ngClass]="form.controls.applyToWholeShift.value ? 'd-none' : ''">
                    </multiple-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="staff-needed" [title]="'::INFO_StaffNeeded' | abpLocalization">{{'::Label_StaffNeeded'|abpLocalization}}</label><span> * </span>
                    <input appInputNumber [min]="0" id="staff-needed" class="form-control" formControlName="staffNeeded" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="staff-actual" [title]="'::INFO_StaffActual' | abpLocalization">{{'::Label_StaffActual'|abpLocalization}}</label><span> * </span>
                    <input appInputNumber [min]="0" id="staff-actual" class="form-control" formControlName="staffActual" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2 d-flex align-items-center">
                    <div class="form-check ">
                        <input type="checkbox" id="apply-to-whole-shift" class="form-check-input"
                            formControlName="applyToWholeShift" />
                        <label class="form-check-label" [title]="'::INFO_ApplytoWholeShift' | abpLocalization">
                            {{ '::Label_ApplytoWholeShift' | abpLocalization }}
                        </label>
                    </div>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="operation" [title]="'::INFO_Operation' | abpLocalization">{{'::LABEL_Operation'|abpLocalization}}</label>
                    <input type="text" id="operation" class="form-control" formControlName="operation" />
                </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" (click)="close()">
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>
