<abp-modal [(visible)]="isModalVisible" [busy]="modalBusy" [options]="{ centered: true, size: 'xl' }"
    (visibleChange)="close($event)">
    <ng-template #abpHeader>
        <h3>{{ '::Create' | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
            <div class="row">
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="area" [title]="'::INFO_Area' | abpLocalization">{{ '::Area' | abpLocalization }}</label><span> * </span>
                    <search-select id="area" [items]="areaData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'area')" [value]="this.form.controls['area'].value">
                    </search-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="cell" [title]="'::INFO_Cell' | abpLocalization">{{ '::Cell' | abpLocalization }}</label><span> * </span>
                    <search-select id="cell" [items]="cellData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'cell')" [value]="this.form.controls['cell'].value">
                    </search-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="workCenter" [title]="'::INFO_WorkCenter' | abpLocalization">{{ '::WorkCenter' | abpLocalization }}</label><span> * </span>
                    <search-select id="workCenter" [items]="workCenterData" displayName="displayName" valueName="id"
                        (change)="selectChange($event, 'workCenter')" [value]="this.form.controls['workCenter'].value">
                    </search-select>
                </div>

                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="work-order" [title]="'::INFO_WorkOrder' | abpLocalization">{{'::Label_WorkOrder'|abpLocalization}}</label><span> * </span>
                    <input type="text" id="work-order" class="form-control" formControlName="workOrder" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="work-order-qty" [title]="'::INFO_WorkOrderQty' | abpLocalization">{{'::Label_WorkOrderQty'|abpLocalization}}</label><span> * </span>
                    <input appInputNumber [min]="0" id="work-order-qty" class="form-control" formControlName="workOrderQty" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="product" [title]="'::INFO_Product' | abpLocalization">{{ '::LABEL_Product' | abpLocalization }}</label><span> * </span>
                    <ng-select
                    id="product"
                    [items]="productData"
                    appendTo="body"
                    bindValue="id"
                    bindLabel="displayName"
                    [typeahead]="productInput$"
                    [placeholder]="'::LABEL_ShowingTopTen' | abpLocalization"
                    formControlName="product">
                    <ng-template ng-option-tmp let-item="item">
                      {{item.displayName}}
                    </ng-template>
                    <ng-template ng-label-tmp let-item="item">
                      {{ item.displayName}}
                    </ng-template>
                    </ng-select>
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="record-timestamp" [title]="'::INFO_RecordTimestamp' | abpLocalization">{{ '::Label_RecordTimestamp'|abpLocalization }}</label>
                    <span> * </span>
                    <input type="text" id="record-timestamp" class="form-control" formControlName="recordTimestamp"
                        bsDatepicker
                        [bsConfig]="{containerClass: 'theme-dark-blue', adaptivePosition: true, withTimepicker: true, keepDatepickerOpened: true, dateInputFormat: 'DD MMM YYYY hh:mm:ss a'}" />
                </div>
                <div class="form-group col col-12 col-md-4 mb-2">
                    <label for="operation" [title]="'::INFO_Operation' | abpLocalization">{{'::LABEL_Operation'|abpLocalization}}</label>
                    <input type="text" id="operation" class="form-control" formControlName="operation" />
                </div>
            </div>
            <div class="row">
                <div class="form-group col col-12 col-md-12 mb-2 d-flex justify-content-between">
                    <p class="fw-bolder">{{ '::Label_ScrapList' | abpLocalization }}</p>
                    <div>
                        <button type="button" class="btn btn-primary btn-sm" (click)="create()">
                            {{ '::Create' | abpLocalization }}
                        </button>
                        <button type="button" class="btn btn-danger btn-sm ms-2" (click)="delete()">
                            {{ 'AbpUi::Delete' | abpLocalization }}
                        </button>
                    </div>
                </div>
                <div class="form-group col col-12 col-md-12 mb-2">
                    <ngx-datatable [rows]="scrapList" [count]="scrapList.length" [limit]="10"
                        [selectionType]="'checkbox'" [selected]="selectedScrap" default id="scrapDataTable">
                        <ngx-datatable-column name="" [checkboxable]="true" [headerCheckboxable]="scrapList.length"
                            [maxWidth]="50" [sortable]="false"></ngx-datatable-column>
                        <ngx-datatable-column [name]="('::Label_ScrapReason' | abpLocalization) + ' * '" [maxWidth]="300"
                            [sortable]="false">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                <div class="form-group">
                                    <ng-select [items]="scrapReasonData" appendTo="body" bindValue="id" bindLabel="displayName"
                                        [ngModelOptions]="{standalone: true}" (change)="scrapResonCheck()"
                                        [(ngModel)]="row.scrapReason">
                                    </ng-select>
                                </div>
                            </ng-template>
                        </ngx-datatable-column>
                        <ngx-datatable-column [name]="('::Label_ScrapQty' | abpLocalization) + ' * '" [maxWidth]="300"
                            [sortable]="false">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                                <div class="form-group scrap-qty">
                                    <input appInputNumber [min]="0" id="scrap-qty" class="form-control h-100"
                                        (ngModelChange)="sumScrapQty()" [(ngModel)]="row.scrapQty"
                                        [ngModelOptions]="{standalone: true}" />
                                </div>
                            </ng-template>
                        </ngx-datatable-column>
                    </ngx-datatable>
                </div>
            </div>
            <div class="row">
                <div class="form-group col col-12 col-md-4">
                    <label for="total-scrap-qty" [title]="'::INFO_TotalScrapQty' | abpLocalization">{{'::Label_TotalScrapQty'|abpLocalization}}</label>
                    <input type="number" id="total-scrap-qty" class="form-control" formControlName="totalScrapQty" />
                </div>
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner"></i></div>
        }
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" (click)="close()">
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid || scrapResonVaild" (click)="save()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>
