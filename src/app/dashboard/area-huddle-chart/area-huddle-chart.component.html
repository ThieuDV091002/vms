<div class="h-100 ps-1 pe-1 widget-page" [ngClass]="{'widget-fullscreen': expandChart}">
    <div class="d-flex justify-content-end align-items-center position-relative" style="height: 15px;">
        <div class="position-absolute start-50 translate-middle" style="top: 12px;">
            @if (type === 'COPQ') {
            <h5 class="mb-0 text-nowrap">{{ copqChartTitle | abpLocalization}} </h5>
            } @else if(type === 'POEE') {
            <h5 class="mb-0">{{ '::LABEL_POEEPercentage' | abpLocalization}} </h5>
            }
        </div>
        <div class="text-end widget-toolbar">
            @if (!queryId) {
            <span class="me-2 cursor-pointer" (click)="deleteWidget()" *abpPermission="'Dashboard.Update'">
                <i class="fa fa-trash fa-lg"></i>
            </span>
            }
            <span class="me-2 cursor-pointer" (click)="expand()">
                @if (expandChart) {
                <i class="fa fa-compress fa-lg"></i>
                } @else {
                <i class="fa fa-expand fa-lg"></i>
                }
            </span>
        </div>
    </div>
    <div class="area-chart-container">
        <abp-chart #areaHuddleChart [data]="chartOptions.data" [options]="chartOptions.options" [width]="'100%'"
            height="100%">
        </abp-chart>
    </div>
</div>
