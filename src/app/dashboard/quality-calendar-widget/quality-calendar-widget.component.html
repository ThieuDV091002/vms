<div class="h-100 ps-1 pe-1 widget-page" [ngClass]="{'widget-fullscreen': expandChart}">
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <div class="month-change-button me-1 cursor-pointer" (click)="calendarApi.prev()">
                <i class="fa-solid fa-angle-left"></i>
            </div>
            <h5 class="mb-0">{{date}}</h5>
            <div class="month-change-button ms-1 cursor-pointer" (click)="calendarApi.next()">
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
        <div>
            <h5 class="mb-0">{{ title | abpLocalization }}</h5>
        </div>
        <div class="text-end widget-toolbar">
            @if (!queryId) {
            <span class="me-2 cursor-pointer" (click)="deleteWidget()" *abpPermission="'Dashboard.Update'">
                <i class="fa fa-trash fa-lg"></i>
            </span>
            }
            <span class="me-2 cursor-pointer" (click)="expand()">
                @if (expandChart) {
                <i class="fa fa-compress fa-lg"></i>
                } @else {
                <i class="fa fa-expand fa-lg"></i>
                }
            </span>
        </div>
    </div>
    <div class="d-flex flex-column container-height">
        <full-calendar #qualityCalendar [options]="calendarOptions"></full-calendar>
    </div>
</div>

<abp-modal [(visible)]="isSettingsModalVisible">
    <ng-template #abpHeader>
        <h3>{{ 'AbpSettingManagement::Settings' | abpLocalization }}</h3>
    </ng-template>
    <ng-template #abpBody>
        @if (form) {
        <form [formGroup]="form" (keydown.enter)="$event.preventDefault()">
            <div class="form-group mb-2">
                <label for="widget-name" [title]="'::INFO_Name' | abpLocalization">{{'::Name'|abpLocalization}}</label>
                <input type="text" id="widget-name" class="form-control" formControlName="title" autofocus />
            </div>
            <div class="form-group mb-2">
                <div class="d-flex">
                    <label class="col-form-label text-start" [title]="'::INFO_HideTitle' | abpLocalization">
                        {{ '::Label_HideTitle' | abpLocalization }}
                    </label>
                    <div class="col-form-label ms-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="hide-title"
                                formControlName="hideTitle" />
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group mb-2">
                <label for="widget-name" [title]="'::INFO_RefreshRateMin' | abpLocalization">{{'::RefreshRate(Min)'|abpLocalization}}</label>
                <input type="number" id="widget-name" class="form-control" formControlName="refreshRate" autofocus />
            </div>
        </form>
        } @else {
        <div class="text-center"><i class="fa fa-pulse fa-spinner"></i></div>
        }

    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-outline-primary" abpClose>
            {{ 'AbpIdentity::Cancel' | abpLocalization }}
        </button>
        <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="saveSettings()">
            {{ 'AbpIdentity::Save' | abpLocalization }}
        </abp-button>
    </ng-template>
</abp-modal>
