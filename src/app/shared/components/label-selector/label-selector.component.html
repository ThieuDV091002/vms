<div class="card">
  <div class="card-header">
    Featured
  </div>
  <div class="card-body">
    <div class="container">
      <div class="col-md-12">
        <div class="input-group">
          <input #searchInput type=" search" class="form-control" [placeholder]="'AbpUi::PagerSearch' | abpLocalization"
            title="search" [(ngModel)]="filter" (change)="search()" (keydown.enter)="search()" />
          <button class="btn btn-primary" type="button" (click)="search()" title="search">
            <i class="fa fa-search"></i>
          </button>
        </div>
      </div>
      <div class="col-md-12">
        <ngx-datatable default [rows]="labels" [headerHeight]="40" [limit]="10" [reorderable]="true">
          <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="label"></ngx-datatable-column>
          <ngx-datatable-column [name]="'::Value' | abpLocalization" prop="value"></ngx-datatable-column>
          <ngx-datatable-column [maxWidth]="80" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button class="btn btn-primary btn-sm " aria-haspopup="true" (click)="select(row)">
                {{ '::Select' | abpLocalization }}
              </button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    </div>

  </div>
</div>
