<nav
        class="fixed top-0 left-0 z-50 flex items-center bg-white justify-between w-full px-6 md:px-16 lg:px-24 xl:px-32 transition-all duration-500"
        [ngClass]="
    isScrolled
      ? 'bg-white/80 shadow-md text-slate-800 backdrop-blur py-3'
      : 'py-5 text-slate-800'
  "
>
    <!-- Logo -->
    <a href="/index.html" style="font-size: 32px; font-weight: var(--font-weight-bold);color: #dc3545;">
        <span class="text-danger"><strong>molex</strong></span>
    </a>

    <!-- Desktop links -->
    <div class="hidden md:flex items-center gap-8 transition duration-500">
        <a href="/" class="hover:text-slate-500 transition">Home</a>
        <a href="/travel-guide" class="hover:text-slate-500 transition"
        >Travel Guide</a
        >
    </div>

    <button
            class="hidden md:block px-6 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all rounded-full"
    >
        Sign In
    </button>

    <!-- Mobile menu button -->
    <button (click)="toggleMenu()" class="md:hidden active:scale-90 transition">
        <svg
                xmlns="http://www.w3.org/2000/svg"
                width="26"
                height="26"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
        >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
        </svg>
    </button>
</nav>
<div class="bg-blue-50 pt-20">
    <app-traveling-guide></app-traveling-guide>
    <app-accordion></app-accordion>
</div>
<app-footer></app-footer>
