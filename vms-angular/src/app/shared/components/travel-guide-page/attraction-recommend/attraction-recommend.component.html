<div class="flex items-center justify-center">
    <button (click)="prevSlide(); resetAutoSlide()"
            class="md:p-2 p-1 bg-black/30 md:mr-6 mr-2 rounded-full hover:bg-black/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
    </button>

    <div class="w-full max-w-3xl overflow-hidden relative">
        <div class="flex transition-transform duration-500 ease-in-out"
             [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
            @for (slide of slides; track $index) {
                <div class="w-full flex-shrink-0 relative cursor-pointer"
                     (click)="openLink(slide.link)">
                    <img [src]="slide.src" [alt]="'Slide ' + $index"
                         class="w-full h-auto object-cover" />

                    <div class="absolute top-4 left-4 text-white font-bold text-2xl px-2 py-1 rounded">
                        {{ slide.topText }}
                    </div>

                    <div class="absolute bottom-4 left-4 flex flex-col items-start gap-1">
                        <div class="text-md font-medium text-white drop-shadow">
                            {{ slide.bottomSubText }}
                        </div>

                        <div class="bg-white/90 text-black text-base font-medium px-3 py-2 rounded">
                            {{ slide.bottomText }}
                        </div>
                    </div>

                </div>
            }
        </div>
    </div>

    <button (click)="nextSlide(); resetAutoSlide()"
            class="p-1 md:p-2 bg-black/30 md:ml-6 ml-2 rounded-full hover:bg-black/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
    </button>
</div>
